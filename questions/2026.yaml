# 2026 달레 스터디 개발자 설문조사 문항 원본
#
# id 와 선택지 code 는 연도별 비교의 키다. 회차를 연 뒤에는 fixed: true 문항의 문구·선택지·순서를 바꾸지 않는다.
# 선택지를 늘릴 때는 기존 code 를 지우지 않고 "기타"를 쪼개는 식으로 새 code 를 더한다.
# show_if 는 키마다 AND, 값 목록은 OR 이다. required 를 적지 않으면 필수다.
# order 는 single·multi 문항에 꼭 적는다. ordinal(경력, 연봉처럼 선택지에 순서가 있다)은 결과 화면에서 이 순서 그대로,
# nominal(언어, 도구처럼 순서가 없다)은 비율이 높은 순으로 보여 준다. 화면에만 쓰는 값이라 fixed 문항에도 적을 수 있다.
# 동의와 만 14세 확인은 문항이 아니라 설문 앞 단계에서 처리한다.

edition: "2026"
status: draft

sections:
  - id: about
    title: 나에 대해
    questions:
      - id: status
        fixed: true
        type: single
        order: nominal
        label: 지금 어떤 상황인가요?
        options:
          - { code: employed, label: "개발자로 일하고 있어요" }
          - { code: job_seeking, label: "개발 일자리를 찾고 있어요" }
          - { code: student, label: "학생이에요" }
          - { code: other_job, label: "개발 말고 다른 일을 해요" }
          - { code: not_working, label: "지금은 일을 쉬고 있어요" }

      - id: experience
        fixed: true
        type: single
        order: ordinal
        label: 개발자로 일한 기간은 모두 합쳐 얼마나 되나요?
        help: 인턴은 넣고, 학생 때 혼자 공부한 기간은 빼 주세요.
        options:
          - { code: none, label: "아직 없어요" }
          - { code: "0_2", label: "2년 이하" }
          - { code: "3_5", label: "3~5년" }
          - { code: "6_9", label: "6~9년" }
          - { code: "10_14", label: "10~14년" }
          - { code: "15_plus", label: "15년 이상" }

      - id: role
        fixed: true
        type: multi
        order: nominal
        limit: 2
        label: 주로 맡은(또는 맡고 싶은) 직무는 무엇인가요?
        help: 두 개까지 고를 수 있어요.
        options:
          - { code: backend, label: "백엔드" }
          - { code: frontend, label: "프론트엔드" }
          - { code: fullstack, label: "풀스택" }
          - { code: mobile, label: "모바일 앱" }
          - { code: data_eng, label: "데이터 엔지니어링" }
          - { code: data_analysis, label: "데이터 분석, 데이터 사이언스" }
          - { code: ai_ml, label: "AI, 머신러닝 엔지니어링" }
          - { code: devops, label: "DevOps, 인프라, SRE" }
          - { code: security, label: "보안" }
          - { code: embedded, label: "임베디드, 시스템" }
          - { code: game, label: "게임" }
          - { code: qa, label: "QA, 테스트" }
          - { code: manager, label: "엔지니어링 매니저" }
          - { code: other, label: "기타" }

      - id: age
        fixed: true
        type: single
        order: ordinal
        required: false
        label: 나이는 어떻게 되나요?
        options:
          - { code: "14_19", label: "14~19세" }
          - { code: "20_24", label: "20~24세" }
          - { code: "25_29", label: "25~29세" }
          - { code: "30_34", label: "30~34세" }
          - { code: "35_39", label: "35~39세" }
          - { code: "40_44", label: "40~44세" }
          - { code: "45_plus", label: "45세 이상" }
          - { code: no_answer, label: "답하지 않을게요" }

      - id: region
        fixed: true
        type: single
        order: nominal
        label: 주로 어느 지역에서 일하나요?
        help: 일하지 않는다면 사는 곳을 골라 주세요.
        options:
          - { code: seoul, label: "서울" }
          - { code: gyeonggi, label: "경기" }
          - { code: incheon, label: "인천" }
          - { code: busan_ulsan_gyeongnam, label: "부산·울산·경남" }
          - { code: daegu_gyeongbuk, label: "대구·경북" }
          - { code: daejeon_sejong_chungcheong, label: "대전·세종·충청" }
          - { code: gwangju_jeolla, label: "광주·전라" }
          - { code: gangwon_jeju, label: "강원·제주" }
          - { code: abroad, label: "해외" }

  - id: workplace
    title: 일하는 곳
    show_if: { status: [employed] }
    questions:
      - id: employment_type
        fixed: true
        type: single
        order: nominal
        label: 어떤 형태로 일하고 있나요?
        options:
          - { code: permanent, label: "정규직" }
          - { code: contract, label: "계약직" }
          - { code: dispatch, label: "파견" }
          - { code: freelance, label: "프리랜서" }
          - { code: founder, label: "창업, 대표" }
          - { code: other, label: "기타" }

      - id: company_type
        fixed: true
        type: single
        order: nominal
        label: 지금 일하는 곳은 어떤 곳인가요?
        options:
          - { code: large, label: "대기업" }
          - { code: midsize, label: "중견기업" }
          - { code: small, label: "중소기업" }
          - { code: startup, label: "스타트업" }
          - { code: si_sm, label: "SI·SM 회사" }
          - { code: public, label: "공공기관·공기업" }
          - { code: foreign, label: "외국계 기업" }
          - { code: none, label: "회사에 속해 있지 않아요" }

      - id: company_size
        fixed: true
        type: single
        order: ordinal
        label: 회사 직원은 모두 몇 명인가요?
        show_if: { company_type: [large, midsize, small, startup, si_sm, public, foreign] }
        options:
          - { code: lt_10, label: "10명 미만" }
          - { code: "10_49", label: "10~49명" }
          - { code: "50_299", label: "50~299명" }
          - { code: "300_999", label: "300~999명" }
          - { code: "1000_4999", label: "1,000~4,999명" }
          - { code: "5000_plus", label: "5,000명 이상" }
          - { code: unknown, label: "잘 모르겠어요" }

      - id: contract_position
        fixed: false
        type: single
        order: ordinal
        label: 지금 하는 일은 발주 구조에서 어디쯤인가요?
        help: 자사 서비스를 만든다면 첫 번째를 골라 주세요.
        show_if: { company_type: [si_sm, none] }
        options:
          - { code: owner, label: "발주처, 자사 서비스" }
          - { code: prime, label: "원청" }
          - { code: sub_1, label: "1차 하청" }
          - { code: sub_2_plus, label: "2차 이하 하청" }
          - { code: unknown, label: "잘 모르겠어요" }

      - id: work_mode
        fixed: true
        type: single
        order: ordinal
        label: 주로 어디서 일하나요?
        options:
          - { code: onsite, label: "매일 출근해요" }
          - { code: hybrid, label: "출근과 재택을 섞어요" }
          - { code: remote, label: "거의 재택이에요" }

      - id: weekly_hours
        fixed: true
        type: single
        order: ordinal
        label: 지난 한 달 동안 일주일에 평균 몇 시간쯤 일했나요?
        options:
          - { code: lte_40, label: "40시간 이하" }
          - { code: "41_45", label: "41~45시간" }
          - { code: "46_52", label: "46~52시간" }
          - { code: gt_52, label: "52시간 넘게" }

  - id: compensation
    title: 보상
    show_if: { status: [employed] }
    questions:
      - id: salary
        fixed: true
        type: single
        order: ordinal
        required: false
        label: 세전 연봉은 어느 구간인가요?
        help: 성과급을 뺀 계약 연봉으로 골라 주세요. 프리랜서는 지난 1년 수입으로 답하면 돼요.
        options:
          - { code: lt_20, label: "2천만 원 미만" }
          - { code: "20_30", label: "2천만~3천만 원" }
          - { code: "30_40", label: "3천만~4천만 원" }
          - { code: "40_50", label: "4천만~5천만 원" }
          - { code: "50_60", label: "5천만~6천만 원" }
          - { code: "60_70", label: "6천만~7천만 원" }
          - { code: "70_80", label: "7천만~8천만 원" }
          - { code: "80_90", label: "8천만~9천만 원" }
          - { code: "90_100", label: "9천만~1억 원" }
          - { code: "100_150", label: "1억~1억 5천만 원" }
          - { code: "150_200", label: "1억 5천만~2억 원" }
          - { code: "200_plus", label: "2억 원 이상" }
          - { code: no_answer, label: "답하지 않을게요" }

      - id: salary_change
        fixed: true
        type: single
        order: ordinal
        required: false
        label: 1년 전보다 연봉이 어떻게 바뀌었나요?
        options:
          - { code: up_10_plus, label: "10% 이상 올랐어요" }
          - { code: up_lt_10, label: "조금 올랐어요 (10% 미만)" }
          - { code: same, label: "그대로예요" }
          - { code: down, label: "줄었어요" }
          - { code: new, label: "1년 전에는 일하지 않았어요" }
          - { code: no_answer, label: "답하지 않을게요" }

      - id: total_comp
        fixed: true
        type: single
        order: ordinal
        required: false
        label: 지난해 실제로 받은 세전 총보상은 어느 구간인가요?
        help: 성과급, 인센티브, 주식 보상을 모두 넣어 주세요. 연말정산 근로소득 원천징수영수증의 "총급여"를 보면 돼요.
        show_if: { employment_type: [permanent, contract, dispatch] }
        options_from: salary

  - id: career
    title: 커리어
    questions:
      - id: job_satisfaction
        fixed: true
        type: scale
        label: 지금 하는 일에 얼마나 만족하나요?
        show_if: { status: [employed] }
        min: { value: 1, label: "전혀 만족하지 않아요" }
        max: { value: 5, label: "아주 만족해요" }

      - id: job_good
        fixed: true
        type: multi
        order: nominal
        limit: 2
        label: 지금 일하는 곳에서 가장 만족하는 점은 무엇인가요?
        help: 두 개까지 고를 수 있어요.
        show_if: { status: [employed] }
        options:
          - { code: pay, label: "연봉" }
          - { code: growth, label: "성장할 기회" }
          - { code: stability, label: "회사의 안정성" }
          - { code: hours, label: "근무 시간과 워라밸" }
          - { code: flexible, label: "재택, 유연 근무" }
          - { code: culture, label: "동료와 조직 문화" }
          - { code: reputation, label: "회사 규모와 인지도" }
          - { code: commute, label: "출퇴근 거리" }
          - { code: domain, label: "서비스와 도메인" }
          - { code: tech, label: "기술 스택과 코드 품질" }
          - { code: leadership, label: "리더와 매니저" }
          - { code: evaluation, label: "평가와 승진" }
          - { code: other, label: "기타" }

      - id: job_pain
        fixed: true
        type: multi
        order: nominal
        limit: 2
        label: 지금 일하는 곳에서 가장 힘든 점은 무엇인가요?
        help: 두 개까지 고를 수 있어요.
        show_if: { status: [employed] }
        options_from: job_good

      - id: first_job_route
        fixed: false
        type: single
        order: nominal
        label: 첫 개발 일자리는 어떻게 구했나요?
        show_if: { experience: ["0_2", "3_5", "6_9", "10_14", "15_plus"] }
        options:
          - { code: open_recruit, label: "신입 공채" }
          - { code: rolling, label: "수시 채용" }
          - { code: intern, label: "인턴에서 전환" }
          - { code: referral, label: "지인 추천" }
          - { code: bootcamp, label: "부트캠프나 교육 과정 연계" }
          - { code: alt_service, label: "산업기능요원·전문연구요원" }
          - { code: founder, label: "창업하거나 프리랜서로 시작" }
          - { code: other, label: "기타" }

      - id: job_search
        fixed: true
        type: single
        order: ordinal
        label: 지난 1년 동안 이직이나 취업 준비를 해 봤나요?
        options:
          - { code: none, label: "하지 않았어요" }
          - { code: browsed, label: "알아보기만 했어요" }
          - { code: applied, label: "지원해 봤어요" }
          - { code: moved, label: "지원해서 옮기거나 취업했어요" }

      - id: coding_test
        fixed: true
        type: single
        order: ordinal
        label: 지난 1년 동안 채용 코딩 테스트를 몇 번 봤나요?
        show_if: { job_search: [applied, moved] }
        options:
          - { code: "0", label: "보지 않았어요" }
          - { code: "1_2", label: "1~2번" }
          - { code: "3_5", label: "3~5번" }
          - { code: "6_plus", label: "6번 이상" }

      - id: job_search_months
        fixed: true
        type: single
        order: ordinal
        label: 개발 일자리를 찾은 지 얼마나 됐나요?
        show_if: { status: [job_seeking] }
        options:
          - { code: lt_3, label: "3개월 미만" }
          - { code: "3_6", label: "3~6개월" }
          - { code: "6_12", label: "6~12개월" }
          - { code: "12_plus", label: "1년 이상" }

      - id: applications
        fixed: true
        type: single
        order: ordinal
        label: 지난 1년 동안 몇 곳에 지원했나요?
        show_if: { status: [job_seeking] }
        options:
          - { code: "0", label: "지원하지 않았어요" }
          - { code: "1_9", label: "1~9곳" }
          - { code: "10_29", label: "10~29곳" }
          - { code: "30_99", label: "30~99곳" }
          - { code: "100_plus", label: "100곳 이상" }

      - id: job_search_hardest
        fixed: false
        type: multi
        order: nominal
        limit: 2
        label: 일자리를 찾으면서 가장 어려운 점은 무엇인가요?
        help: 두 개까지 고를 수 있어요.
        show_if: { status: [job_seeking] }
        options:
          - { code: coding_test, label: "코딩 테스트" }
          - { code: experience_required, label: "경력을 요구하는 공고" }
          - { code: few_openings, label: "공고가 적어요" }
          - { code: interview, label: "면접" }
          - { code: portfolio, label: "포트폴리오, 이력서" }
          - { code: other, label: "기타" }

      - id: company_criteria
        fixed: true
        type: multi
        order: nominal
        limit: 3
        label: 일할 곳을 고를 때 무엇을 가장 중요하게 보나요?
        help: 세 개까지 고를 수 있어요.
        options:
          - { code: pay, label: "연봉" }
          - { code: growth, label: "성장할 기회" }
          - { code: stability, label: "회사의 안정성" }
          - { code: hours, label: "근무 시간과 워라밸" }
          - { code: flexible, label: "재택, 유연 근무" }
          - { code: culture, label: "동료와 조직 문화" }
          - { code: reputation, label: "회사 규모와 인지도" }
          - { code: commute, label: "출퇴근 거리" }
          - { code: domain, label: "서비스와 도메인" }
          - { code: other, label: "기타" }

      - id: next_workplace
        fixed: false
        type: single
        order: nominal
        label: 다음에는 어떤 곳에서 일하고 싶나요?
        options:
          - { code: stay, label: "지금 일하는 곳에 남고 싶어요" }
          - { code: large, label: "대기업" }
          - { code: midsize_small, label: "중견·중소기업" }
          - { code: startup, label: "스타트업" }
          - { code: public, label: "공공기관·공기업" }
          - { code: foreign, label: "외국계 기업" }
          - { code: abroad, label: "해외 회사" }
          - { code: independent, label: "프리랜서, 창업" }
          - { code: undecided, label: "아직 모르겠어요" }

      - id: career_concern
        fixed: false
        type: multi
        order: nominal
        limit: 2
        label: 요즘 커리어에서 가장 큰 고민은 무엇인가요?
        help: 두 개까지 고를 수 있어요.
        options:
          - { code: expertise, label: "전문성이 부족한 것 같아요" }
          - { code: pay, label: "연봉" }
          - { code: market, label: "얼어붙은 채용 시장" }
          - { code: ai, label: "AI가 바꿀 일자리" }
          - { code: direction, label: "앞으로 나아갈 방향" }
          - { code: balance, label: "일과 삶의 균형" }
          - { code: other, label: "기타" }

  - id: growth
    title: 성장
    questions:
      - id: study_hours
        fixed: true
        type: single
        order: ordinal
        label: 업무나 수업 밖에서 개발 공부를 일주일에 몇 시간쯤 하나요?
        options:
          - { code: "0", label: "하지 않아요" }
          - { code: "1_2", label: "1~2시간" }
          - { code: "3_5", label: "3~5시간" }
          - { code: "6_10", label: "6~10시간" }
          - { code: gt_10, label: "10시간 넘게" }

      - id: growth_activities
        fixed: true
        type: multi
        order: nominal
        label: 지난 1년 동안 성장을 위해 꾸준히 한 것은 무엇인가요?
        help: 해당하는 걸 모두 골라 주세요.
        options:
          - { code: reading, label: "책 읽기" }
          - { code: writing, label: "블로그, 글쓰기" }
          - { code: study_group, label: "스터디 모임" }
          - { code: side_project, label: "사이드 프로젝트" }
